        - text: "Selecione a obra para exibir dados e capa do anime. Caminho absoluto da pasta contendo os vídeos a serem auditados por codecs, faixas e sincronia. Diretório onde serão gravados os relatórios da análise. Deixe em branco para salvar por padrão na subpasta 'relatorios' dentro da pasta da mídia. Iniciar varredura técnica de arquivos de mídia Limpa todos os campos e oculta o cartão do anime Alternar altura expandida do console Baixar o resultado da análise como arquivo .txt Copiar conteúdo do console Diretório (busca em subpastas também) onde se encontram os vídeos originais dos quais serão extraídas as faixas de legenda. Suporta MKV/WebM e, via ffmpeg, MP4/MOV/AVI/TS/M2TS/FLV/WMV. Diretório onde as legendas extraídas serão salvas. Deixe em branco para salvar por padrão na subpasta 'legendas_extraidas_[formato]' dentro da pasta da mídia. O formato de destino da extração. Prefira ASS para animes para preservar estilos, fontes e posições dos textos. Dica: rode a Análise de Mídia antes para descobrir o formato e o tipo de cada faixa (texto = traduzível; bitmap = requer OCR). Apenas ASS e SRT seguem para a tradução; PGS é bitmap e não é traduzível. Iniciar extração paralela das faixas de legenda via mkvextract Limpa todos os campos da extração Alternar altura expandida do console Copiar conteúdo do console O arquivo de legenda original (inglês) usado como referência. O formato detectado será exibido no relatório. O arquivo gerado pelo LLM (português). O relatório identifica seu formato e analisa possíveis danos estruturais. Executa o motor de regras de auditoria de conteúdo Limpa os campos e o relatório exibido Exporta o relatório em Markdown (.md) — formato didático para revisão Exporta o relatório em JSON (formato técnico) Alternar altura expandida do console Copiar conteúdo do console Define qual pacote de regras de lore será usado pela LLM. Pasta contendo os arquivos de legenda originais (geralmente em inglês) que serão traduzidos pela LLM. Pasta de destino onde as legendas traduzidas serão salvas. Por padrão (campo vazio), cria a pasta 'traducao_ptbr' no MESMO NÍVEL da pasta de legendas originais (ao lado dela, dentro da pasta da mídia/temporada). Arquiva o cache anterior da pasta selecionada, retraduz integralmente sem reaproveitá-lo e atualiza os arquivos PT-BR. Cache e legenda anteriores recebem backup obrigatório. Iniciar tradução em lote pelo servidor local do LM Studio Limpa todos os campos e oculta o cartão do anime Alternar altura expandida do console Copiar conteúdo do console Pasta com os arquivos de legenda em inglês que serão traduzidos. Vazio cria 'traducao_ptbr_sem_lore' ao lado da pasta de legendas originais, para não se misturar com a tradução definitiva. Por padrão, se a pasta for de uma obra que JÁ tem lore declarada, a execução é bloqueada e a mensagem diz qual contexto usar. Marque só se quiser mesmo traduzir cru uma obra que tem lore. Traduzir sem aplicar lore, com saída separada Limpa todos os campos Alternar altura expandida do console Copiar conteúdo do console Caches novos usam automaticamente a lore registrada na proveniência de cada arquivo. Se houver cache antigo sem proveniência, selecione aqui a obra correta. Caminho do diretório de cache. Deixe vazio para usar a pasta padrão 'cache'. Limpa todos os campos e oculta o cartão do anime Invalida somente fallbacks e respostas defeituosas; nomes e termos autorizados pela lore são preservados. Preenche traduções vazias ou inválidas enviando somente essas falas ao Google Translate online. Revisa apenas traduções PT-BR suspeitas com o LLM local e a lore registrada em cada arquivo. ENSAIO: mede quantas vezes cada termo oficial da lore seria restaurado no cache já gravado. Não escreve nada. APLICA a terminologia oficial ao cache já gravado, com backup e escrita atômica. Rode o ensaio antes. Alternar altura expandida do console Copiar conteúdo do console Define gênero de personagens e regras de tratamento para a revisão de pronomes, artigos e adjetivos. Arquivos *_PT-BR.ass ou *_PTBR_TrackN.ass gerados pela tradução. Se os .ass em inglês estiverem em outra pasta. Vazio = procura na mesma pasta do PT (_Track2.ass, etc.). Pasta com os .cache.json. O campo 'original' de cada entrada faz o papel da legenda em inglês. Vazio = pasta 'cache' padrão do projeto. Limpa todos os campos e oculta o cartão do anime Detecta inglês residual e re-traduz falas problemáticas via Google Translate Corrige concordância PT-BR (gênero, pronomes, artigos, tratamentos) via LLM local Alternar altura expandida do console Copiar conteúdo do console Exibe a capa/dados da obra e ativa a correção de falas suspeitas via LLM local. Vazio = correção estrutural sem LLM. Pasta com as legendas originais usadas como referência. Estes arquivos não são alterados. Pasta com as legendas em português que serão corrigidas. Somente estes arquivos são gravados. Corrige todos os pares original/traduzido encontrados. A original é somente leitura. Limpa todos os campos e oculta o cartão do anime Alternar altura expandida do console Copiar conteúdo do console Caminho da pasta que contém os episódios de vídeo em formato MKV (sem legenda em português). Diretório onde estão as novas legendas ASS traduzidas. Pressione Enter para buscar automaticamente na pasta padrão do projeto. Use quando o vídeo e a legenda vêm de releases/fontes diferentes e a legenda fica atrasada ou adiantada em relação à fala. Positivo atrasa a legenda, negativo adianta. Ex: 350 ou -1200. A legenda PT-BR entra como PRIMEIRA opção — é a que abre por padrão no player. As faixas que já estavam no arquivo continuam disponíveis como segunda escolha. Nenhuma legenda é removida: perder a faixa de origem é irreversível a partir do MKV remuxado. Cria um temporário, valida vídeo/áudio/legenda PT-BR e só então publica o MKV final. Destinos existentes nunca são sobrescritos. Limpa todos os campos do remuxer Alternar altura expandida do console Copiar conteúdo do console Selecione a obra para carregar capa e metadados via API. Selecione a pasta da etapa atual que você quer limpar. Se já traduziu, use legendas-ptbr; se ainda não traduziu, a saída continuará no idioma de entrada. Deixe vazio para criar 'legenda-simplificada' ao lado das pastas de legenda da obra, no mesmo nível de legendas_extraidas_ass e traducao_ptbr. Se informar um caminho, ele deve ser DIFERENTE da entrada — os arquivos lidos são preservados para auditoria. Analisa e mostra linha a linha o que seria trocado, sem gravar nenhum arquivo (Dry-Run). Grava as legendas convertidas na pasta de destino. Originais intocados; manifesto de auditoria salvo em logs/novo-karaoke. Limpa todos os campos e oculta o cartão do anime Alternar altura expandida do console Copiar conteúdo do console Analisa e gera de forma estática o mapa estrutural das classes Java do repositório. Alternar altura expandida do console Baixar o relatório completo do mapa como arquivo .txt Baixar só a árvore de diretórios em Markdown (bloco de código) para colar no GitHub/README Copiar conteúdo do mapa Atualiza as métricas de telemetria agora Faz download do arquivo de telemetria compartilhado para auditoria Gera um snapshot sanitizado (só métricas, sem textos de legenda nem caminhos), commita e faz push para o repositório público kronos-anime-translation-telemetry-dataset no GitHub. Reúne a telemetria espalhada em relatorios/ num arquivo por fatia, sanitizada. Não apaga nada e não duplica ao repetir."
