app:
  modo: WEB

# LOG EM ARQUIVO, UM POR EXECUCAO (pedido de Paulo, 08/08/2026)
#
# O motivo do "um por execucao" nao e espaco, e AUDITORIA: log de execucoes
# misturadas responde errado. Esta registrado no projeto que auditar uma feature
# pelo tradutor.log deu 3 resultados errados no MESMO dia. Com um arquivo por run,
# "o que aconteceu naquela execucao?" volta a ser respondivel.
#
# O carimbo vem de -Dkronos.log.execucao, que o build.gradle gera no lancamento.
# Sem ele (jar solto, IDE), o nome cai em "manual" — que continua sendo um nome
# que a faxina reconhece, entao nem esse caso vira arquivo imortal.
#
# A faxina que apaga os vencidos e core.io.FaxinaLogExecucao, disparada no boot.
# Ela NAO le este caminho de proposito: tem pasta propria e fixa. Se lesse, apontar
# o log para uma pasta com outras coisas faria a faxina apagar essas outras coisas
# — a revisao de erro de boa-fe (regra 15) esta no Javadoc dela.
quarkus:
  log:
    file:
      # 'enable' NAO entra aqui: o Quarkus 3.37 o marca como DEPRECIADO e avisa no boot
      # ("The quarkus.log.file.enable config property is deprecated"). Definir o path ja
      # liga o handler. Este bloco substitui o que vivia em application.properties
      # apontando para o arquivo unico logs/tradutor.log.
      path: "logs/execucoes/kronos-${kronos.log.execucao:manual}.log"
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n"
      level: DEBUG
      # Teto por arquivo: uma execucao de 10h ja produziu 26 MB medidos em 07/08.
      # Passando disso, rotaciona em .1/.2 — o disco nao depende do bom humor do dia.
      #
      # A rotacao por TAMANHO nao substitui o nome por execucao: era justamente ela que
      # falhava no Windows quando duas instancias disputavam logs/tradutor.log
      # ("O arquivo ja esta sendo usado por outro processo", no boot). Com nome unico por
      # run, o conflito nao acontece; a rotacao passa a ser so o teto de uma run longa.
      rotation:
        max-file-size: 50M
        max-backup-index: 3
        # NAO rotacionar no boot. O padrao do Quarkus e rotacionar toda vez que o handler
        # sobe — e em quarkusDev cada HOT RELOAD sobe o handler de novo. Medido em
        # 08/08/2026: uma unica execucao ja tinha kronos-<carimbo>.log e .log.1 depois de
        # duas recompilacoes, fragmentando o log DA MESMA run. Isso e o contrario do
        # pedido ("separado por vezes que o sistema foi executado"): quem separa execucao
        # aqui e o CARIMBO no nome, nao a rotacao. A rotacao fica sendo so o teto de
        # tamanho de uma run longa.
        rotate-on-boot: false

kronos:
  log:
    # Retencao pedida por Paulo. Zero ou negativo DESLIGA a faxina (nao apaga nada):
    # desligar jamais pode virar apagar tudo.
    retencao-dias: 7

# PERFIL DE TESTE: nem log em arquivo, nem faxina.
#
# Fica AQUI, e nao em src/test/resources/application.properties, porque aquele arquivo NAO
# venceu este — medido em 08/08/2026: mesmo com ele presente, a suite recriou
# logs/execucoes/kronos-manual.log (111 KB, 09:35:40-09:36:19) na arvore operacional REAL.
# Os 18 testes @QuarkusTest sobem o Quarkus de verdade e o empate de ordinal entre
# application.yml (main) e application.properties (test) nao resolveu a favor do segundo.
# O prefixo "%test" e o mecanismo oficial de perfil e tem precedencia garantida.
#
# Por que importa: DiretorioBaseKronos redireciona cache/, logs/, relatorios/ e backups/ para
# build/tmp/kronos-tests, mas quarkus.log.file.path e resolvido pelo Quarkus e NAO passa por
# aquele ponto unico — escapava da sandbox. E, pior, escrevia tudo no mesmo "manual", que e
# justamente a mistura de execucoes que o log por execucao existe para acabar.
#
# A faxina fica em zero na suite porque ja tem cobertura propria com @TempDir; ativa aqui,
# seria dar a um teste a chance de apagar arquivo de verdade.
"%test":
  quarkus:
    log:
      file:
        # Path para a arvore descartavel da suite, em vez de 'enable: false' (depreciado).
        # build/ ja e ignorado pelo git e some no clean — se algum @QuarkusTest escrever
        # log, escreve la, nunca em logs/ de producao.
        path: "build/tmp/kronos-tests/logs/suite.log"
  kronos:
    log:
      retencao-dias: 0

# Raizes que o navegador de pastas da interface pode listar (botoes "Procurar...").
# Substitui o dialogo nativo do Windows, que so funcionava com servidor e usuario
# na MESMA maquina — dentro de um conteiner Linux nao ha powershell nem display.
#
# Caminho FORA destas raizes e recusado com 403, nunca listado. Lista vazia
# recusa TUDO: a falha e fechada de proposito.
#
# As tres entradas convivem porque raiz inexistente e ignorada: a MESMA
# configuracao serve Windows (C:/animes) e conteiner (/acervo), sem exigir
# arquivo separado nem variavel de ambiente por ambiente.
navegador:
  raizes:
    - "C:/animes"
    - "/acervo"
    # A propria pasta do KRONOS, necessaria para a Correcao de Cache navegar cache/.
    - "."

tradutor:
  # Pastas padrao para modo WEB (a UI sobrescreve em cada operacao).
  diretorio-entrada: entrada
  diretorio-saida: saida
  diretorio-cache: cache
  # Quantidade de falas por requisicao ao LLM. Modificado para 1 (linha a linha) para evitar falhas e alucinações.
  tamanho-lote: 1
  # Agrupa numa MESMA chamada as falas que formam uma frase partida entre eventos consecutivos
  # ("...realizar uma cerimonia" / "at the Prime Minister's residence"). Com lote 1 o LLM nunca
  # ve a frase inteira e trata a 2a metade como frase nova: at -> "Ate", to usher -> "Para".
  #
  # Medido no Unicorn RE:0096, 22 episodios, 2026-07-29 (583 correntes, 706 ligacoes):
  #   maiuscula indevida na continuacao ... 93,8% -> ~13%
  #   conector virado em abertura ........ 29,7% -> ~1%
  #   chamadas ao LLM .................... 1.289 -> 985 (-23,6%), ja com o fallback
  #   correntes que passam na contagem ... 69% (as outras 31% voltam ao fluxo de hoje)
  # Corrente LONGA sai melhor que curta (K=4 deu 3,5% de maiuscula contra 15,8% do K=2),
  # entao NAO ha teto de agrupamento.
  #
  # DESLIGADA por padrao: ligar troca ~30% de conector errado por ~4% de deslocamento de
  # conteudo -- linha com o texto da vizinha, contagem certa, que a validacao atual NAO pega.
  # Quem intercepta isso e a GuardaCorrenteTraduzida, devolvendo a corrente ao fluxo individual.
  agrupar-frase-partida: true
  # Estilos ASS que nao devem ser traduzidos (ex: letra original em romaji
  # usada para karaoke, que deve permanecer no idioma original).
  estilos-ignorados:
    - "Song JP"
    - "Mobile Suit Gundam"
    - "Char's Counterattack"
    - "OP - Romaji"
    - "OP - English"
    - "ED - Romaji"
    - "ED - English"
    - "ED-ROM"
    # OPL2 -- camada de karaoke do Gundam Unicorn RE:0096, 3.410 linhas medidas em 2026-07-29
    # nos 22 episodios. Uma PALAVRA ou SILABA por linha; sem contexto o LLM devolve invencao
    # ancorada na lore ("sa" virou "Meu nome e Mineva Lao Zabi.").
    #
    # E o UNICO estilo do acervo que escapa do veto de musica. Quem veta e
    # DetectorEfeitoKaraokeService.ESTILO_MUSICA_AMPLO_PATTERN, cujo lookaround e de LETRA
    # -- (?<!\p{L})(...|op|ed|...)(?!\p{L}) --, entao digito e sublinhado nao quebram o
    # casamento e OP2/ED2/OP_S2/ED_S2/ED_English JA sao pegos. "OPL2" nao e, porque o "L"
    # depois de "OP" E letra. Entrada nominal para nao alargar um padrao que hoje decide o
    # que E traduzido (medicao congelada em PadraoMusicaAmploNaoCapturaDialogoTest).
    - "OPL2"
  # Protecao de romaji pelo PAREAMENTO das duas camadas de karaoke (romaji e traducao ocupam o
  # mesmo tempo na tela). Sinal PRIMARIO, independente de nome de estilo e de fonte -- que sao
  # normalizados de proposito. DESLIGADA por padrao: com false a decisao do que traduzir fica
  # identica a de antes. Ver o Plano-Mestre da protecao de romaji no cerebro (2026-07-25).
  protecao-romaji-pareamento: false
  # Chaves de idioma gravadas no cache JSON (par original -> traduzido).
  idioma-original: "en"
  idioma-traduzido: "pt-br"
  # Fallback online de ULTIMO RECURSO (Google Translate) para as falas de dialogo
  # que o LLM local nao conseguiu traduzir. OPT-IN, desligado por padrao: quando
  # false o pipeline e 100% local. Quando true, apenas as pendencias desta execucao
  # vao ao provedor externo, ja validadas pela mesma checagem canonica do LLM.
  fallback-online:
    ativo: true
  llm:
    # O default preserva a execucao fora de conteiner: sem a variavel, e o mesmo
    # 127.0.0.1 de sempre. DENTRO do conteiner, 127.0.0.1 e o proprio conteiner e
    # a traducao morre no primeiro lote com recusa de conexao — por isso o
    # docker-compose injeta KRONOS_LLM_BASE_URL apontando para
    # host.docker.internal, que e o host visto de dentro. Ver docs/ref-docker.md.
    base-url: "${KRONOS_LLM_BASE_URL:http://127.0.0.1:1234/v1}"
    # "current" e proposital: usar o id exato do modelo aqui faz o LM Studio
    # abrir uma segunda instancia via auto-load (JIT) toda vez que o valor nao
    # bate com a instancia ja carregada. O app adapta em runtime para o que
    # estiver carregado (ver LlmClientAdapter.verificarDisponibilidade).
    # Troque o modelo pela UI/lms do LM Studio, nao aqui.
    model: "current"
    temperature: 0.3
    max-tokens: 2000
    connect-timeout: 5s
    read-timeout: 180s

# Stack LLM propria da Revisao de Lore (Opcao 7), isolada do namespace
# tradutor.llm. Defaults equivalentes ao comportamento efetivo atual.
revisao-lore:
  llm:
    # Mesma variavel do tradutor.llm de proposito: e o MESMO LM Studio. Duas
    # variaveis separadas so criariam a chance de uma ser esquecida e a Opcao 7
    # falhar sozinha dentro do conteiner, com o resto funcionando.
    base-url: "${KRONOS_LLM_BASE_URL:http://127.0.0.1:1234/v1}"
    model: "current"
    max-tokens: 2000
    connect-timeout: 5s
    read-timeout: 180s

remuxer:
  mkvmerge-path: mkvmerge

extrator:
  formato: ASS
  mkvmerge-path: mkvmerge
  mkvextract-path: mkvextract
  ffmpeg-path: ffmpeg
  ffprobe-path: ffprobe

tmdb:
  api-key: dummy_key

# Config HTTP propria da fatia apiDadosAnime (timeouts do cliente das APIs de
# metadados de anime: AniList/Jikan/TMDB). Isolada de tradutor.llm; valores
# efetivos preservados (E4a).
api-dados-anime:
  http:
    connect-timeout: 5s
    read-timeout: 180s

# Repositório dedicado do dataset público de telemetria (botão "Publicar
# Dataset" no painel de Telemetria). Nome na convenção da comunidade:
# [NomeDoSistema]-telemetry-dataset. O repositório remoto precisa existir no
# GitHub (criado uma única vez, vazio); o resto é bootstrap automático.
telemetria-dataset:
  # Caminho RELATIVO por padrao, que e como funciona fora de conteiner. Dentro do
  # conteiner "../" resolve para "/" e o repositorio nao existe: o compose monta
  # o repo do host em /dataset e injeta KRONOS_DATASET_REPO apontando para la,
  # de modo que o commit feito no conteiner cai no repositorio do HOST.
  #
  # O PUSH continua sendo operacao do host, de proposito: credencial de git nao
  # entra em conteiner. Ver docs/ref-docker.md.
  repositorio-local: "${KRONOS_DATASET_REPO:../kronos-anime-translation-telemetry-dataset}"
  repositorio-remoto: https://github.com/carmipa/kronos-anime-translation-telemetry-dataset.git
  hardware:
    publicar-ambiente-execucao: true
    permitir-deteccao-automatica: true
